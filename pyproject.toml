[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "evopath"
version = "0.1.0"
description = "Algorytm ewolucyjny do planowania sciezki robota (C++ + Python)"
requires-python = ">=3.8"
dependencies = ["numpy", "matplotlib"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/evopath"]

[tool.scikit-build.cmake.define]
EVO_BUILD_APPS = "OFF"
EVO_BUILD_TESTS = "OFF"
